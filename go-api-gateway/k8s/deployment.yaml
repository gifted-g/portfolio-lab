apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-api-gateway
  template:
    metadata:
      labels:
        app: go-api-gateway
    spec:
      containers:
      - name: app
        image: gifted-g/go-api-gateway:latest
        ports:
        - containerPort: 8080

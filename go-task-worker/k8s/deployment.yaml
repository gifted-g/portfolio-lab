apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-task-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-task-worker
  template:
    metadata:
      labels:
        app: go-task-worker
    spec:
      containers:
      - name: app
        image: gifted-g/go-task-worker:latest
        ports:
        - containerPort: 8080

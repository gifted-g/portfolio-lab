apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-clean-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: go-clean-api
  template:
    metadata:
      labels:
        app: go-clean-api
    spec:
      containers:
      - name: app
        image: gifted-g/go-clean-api:latest
        ports:
        - containerPort: 8080
